# ====================================================================
# Configuration SonarQube Cloud pour PropJV (Monorepo TypeScript)
# ====================================================================


sonar.organization=RafaelVeF
sonar.projectKey=RafaelVeF_propJV
sonar.projectName=propJV

sonar.sources=apps,packages,database
sonar.sourceEncoding=UTF-8


# Ces fichiers et dossiers ne seront PAS comptabilisés comme du code métier de production :
# - Les dépendances et fichiers générés (builds)
# - Les assets multimédias (images, audio)
# - Les fichiers de tests (qui sont audités dans sonar.tests)
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.vite/**,\
  **/coverage/**,\
  **/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.svg,**/*.ico,\
  **/*.mp3,**/*.wav,**/*.ogg,\
  **/*.json,\
  **/*.test.ts,**/*.test.js,**/*.spec.ts,**/*.spec.js,**/test/**

# Définition des répertoires contenant les tests pour que Sonar sache où chercher
sonar.tests=apps,packages
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.js,\
  **/*.spec.ts,\
  **/*.spec.js,\
  **/test/**